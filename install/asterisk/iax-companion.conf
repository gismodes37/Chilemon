;; =============================================================================
;; IAX2 Companion App — Static Peer
;; =============================================================================
;; Este snippet se agrega a /etc/asterisk/iax.conf para el Companion App.
;; El companion se conecta como peer estático (host=dynamic, sin registro).
;;
;; NOTA: Cambiar CHANGEME_COMPANION_SECRET por la contraseña real
;; (debe coincidir con config.toml del companion).
;; =============================================================================

[companion-app]
type=friend
host=dynamic
context=radio-companion
secret=CHANGEME_COMPANION_SECRET

; --- Códec ---
disallow=all
allow=ulaw

; --- Qualify (keepalive / reachability) ---
; qualify=yes habilita POKE/PONG para medir latencia y detectar conectividad.
; qualifyfreqok=60000 → cada 60s cuando el peer está reachable.
; qualifyfreqnotok=10000 → cada 10s cuando está unreachable (retry más rápido).
; maxms=5000 → máximo 5000ms de latencia antes de marcar UNREACHABLE.
;   En LAN típico <5ms, pero 5000 da margen para Wi-Fi o congestión.
qualify=yes
qualifyfreqok=60000
qualifyfreqnotok=10000
maxms=5000

; --- Registro ---
; host=dynamic → el companion se registra dinámicamente.
; Si usás peer estático (host=IP), cambiar a host=192.168.x.x y quitar registration.
requirecalltoken=no
calltokenoptional=127.0.0.1
