;; =============================================================================
;; IAX2 Companion App — Dynamic Peer (any LAN PC)
;; =============================================================================
;; Este snippet se agrega a /etc/asterisk/iax.conf para el Companion App.
;; host=dynamic permite que CUALQUIER PC en la LAN se conecte como companion.
;; El companion se registra con su IP dinámicamente al iniciar.
;;
;; Seguridad: auth=md5 exige AUTHREP (challenge-response) durante el setup
;; de llamadas. El companion ya implementa AUTHREP en iax2.py.
;;
;; NOTA: Cambiar CHANGEME_COMPANION_SECRET por la contraseña real
;; (debe coincidir con config.toml del companion en cada PC).
;; =============================================================================

[companion-app]
type=friend
host=dynamic
context=radio-companion
secret=CHANGEME_COMPANION_SECRET
auth=md5

; --- Códec ---
disallow=all
allow=ulaw

; --- Qualify (keepalive / reachability) ---
; qualify=yes habilita POKE/PONG para medir latencia y detectar conectividad.
; qualifyfreqok=60000 → cada 60s cuando el peer está reachable.
; qualifyfreqnotok=10000 → cada 10s cuando está unreachable (retry más rápido).
; maxms=5000 → máximo 5000ms de latencia antes de marcar UNREACHABLE.
;   En LAN típico <5ms, pero 5000 da margen para Wi-Fi o congestión.
qualify=yes
qualifyfreqok=60000
qualifyfreqnotok=10000
maxms=5000

; --- Call Token ---
; requirecalltoken=no en [general] + calltokenoptional=0.0.0.0/0
; permite conexiones desde cualquier IP de la LAN sin call token.
; Para restringir a una subred específica, cambiar a 192.168.0.0/24.
requirecalltoken=no
