;; =============================================================================
;; Extensions — Companion Audio App
;; =============================================================================
;; Contexto para llamadas IAX2 desde el Companion App (Windows).
;; SIEMPRE entra al nodo local — el linking a nodos remotos
;; se hace por separado con rpt fun *3<remote> desde el dashboard.
;; =============================================================================

[radio-companion]
; Companion IAX2 calls always enter the local node's audio bridge.
; The node linking (rpt fun *3<remote>) is done separately by the dashboard.
; This matches the approach used by radio-ptt (WebRTC bridge).
exten => _X!,1,rpt(61916|S)
 same => n,Hangup()

; Echo test: companion dials *0 to test TX/RX
exten => *0,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Inbound test: Asterisk calls companion
exten => *999,1,Dial(IAX2/companion-app/s)
 same => n,Hangup()
