;; =============================================================================
;; Extensions — Companion Audio App
;; =============================================================================
;; Contexto para llamadas IAX2 desde el Companion App (Windows).
;; SIEMPRE entra al nodo local — el linking a nodos remotos
;; se hace por separado con rpt fun *3<remote> desde el dashboard.
;; =============================================================================

[radio-companion]
; Canonical dialplan for the IAX2 companion. This is the single source of
; truth: install/companion/install.sh injects this file into extensions.conf
; after replacing __LOCAL_NODE__ with CHILEMON_LOCAL_NODE. Companion calls
; always enter the local node's audio bridge; remote linking is done by the
; dashboard with rpt fun *3<remote>. Never echo the dialed extension into
; rpt(): that would let the caller pick an arbitrary node.
exten => _X!,1,rpt(__LOCAL_NODE__|S)
 same => n,Hangup()

; Echo test: companion dials *0 to test TX/RX
exten => *0,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; Inbound test: Asterisk calls companion
exten => *999,1,Dial(IAX2/companion-app/s)
 same => n,Hangup()
