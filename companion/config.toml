# ChileMon Companion App Configuration
# Copy this file to ~/.chilemon/config.toml and edit.

[asterisk]
host = "192.168.0.116"
port = 4569
# local_port = 4569   # Bind to a fixed local port (requires admin on Windows for <1024).
                       # When set, Asterisk can qualify/reach the companion on this port.
                       # Default (commented out) = ephemeral port assigned by OS.

[peer]
username = "companion-app"
# No shared secret is shipped: set this to iax_companion_secret from the Pi's
# config/local.php, or download an auto-generated config.toml from the dashboard.
password = ""
skip_registration = true     # true = static peer in iax.conf; no REGISTER needed

[audio]
# Leave empty to follow the OS default input/output device. This is the
# recommended setting: it works with any mic/headset and survives replugging.
# Set the default device in Windows/macOS sound settings for the app to follow it.
#
# To pin a specific device, use an ID or a NAME SUBSTRING (not a bare index,
# since indices are re-enumerated between runs):
#   input_device = 1
#   output_device = "Auriculares"
# List available devices and the current defaults with:
#   python -m companion.main --list-devices
input_device = ""
output_device = ""
sample_rate = 8000       # ulaw is 8 kHz
frames_per_buffer = 160  # 20ms at 8 kHz

[ws]
bind_host = "127.0.0.1"
bind_port = 9093

[logging]
level = "INFO"          # DEBUG, INFO, WARNING, ERROR
file = ""               # empty = stdout
